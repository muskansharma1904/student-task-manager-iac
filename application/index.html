<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Cloud-Based Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="currentColor"/>
        <path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Student Task Manager</h1>
    </div>
    <span id="env-badge" class="env" hidden></span>
  </header>

  <main>
    <section class="summary" aria-labelledby="summary-title">
      <div class="ring" role="img" aria-label="Completion progress">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <circle class="ring-track" cx="40" cy="40" r="34" />
          <circle id="ring-fill" class="ring-fill" cx="40" cy="40" r="34" pathLength="100" />
        </svg>
        <span id="ring-percent">0%</span>
      </div>
      <div class="summary-text">
        <h2 id="summary-title">Loading your tasks…</h2>
        <p id="summary-next">Fetching from Workers KV.</p>
      </div>
    </section>

    <div class="layout">
      <aside class="composer" aria-labelledby="add-title">
        <h2 id="add-title">Add a task</h2>
        <form id="task-form" novalidate>
          <label for="title">Task title</label>
          <input id="title" name="title" maxlength="200" autocomplete="off" placeholder="Submit Cloud Computing assignment" required />
          <p class="field-error" id="title-error" hidden>Enter a task title.</p>

          <div class="row">
            <div>
              <label for="priority">Priority</label>
              <select id="priority" name="priority">
                <option>High</option>
                <option selected>Medium</option>
                <option>Low</option>
              </select>
            </div>
            <div>
              <label for="status">Status</label>
              <select id="status" name="status">
                <option selected>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn primary" id="add-btn">Add task</button>
        </form>
      </aside>

      <section class="workspace" aria-label="Tasks">
        <div class="toolbar">
          <div class="search">
            <label class="sr-only" for="search">Search tasks</label>
            <input id="search" type="search" placeholder="Search by title or ID" autocomplete="off" />
          </div>
          <label class="sr-only" for="filter-priority">Filter by priority</label>
          <select id="filter-priority">
            <option value="">All priorities</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
          <label class="sr-only" for="sort">Sort tasks</label>
          <select id="sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="priority">Priority</option>
          </select>
          <div class="seg" role="group" aria-label="View">
            <button type="button" id="view-board" aria-pressed="true">Board</button>
            <button type="button" id="view-table" aria-pressed="false">Table</button>
          </div>
        </div>

        <div id="board" class="board"></div>

        <div id="table-wrap" class="table-wrap" hidden>
          <table>
            <thead>
              <tr><th>ID</th><th>Task</th><th>Priority</th><th>Status</th><th>Created</th><th><span class="sr-only">Actions</span></th></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <p id="empty" class="empty" hidden></p>
      </section>
    </div>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form" method="dialog">
      <h2 id="edit-heading">Edit task</h2>
      <label for="edit-title">Task title</label>
      <input id="edit-title" maxlength="200" autocomplete="off" required />
      <div class="row">
        <div>
          <label for="edit-priority">Priority</label>
          <select id="edit-priority"><option>High</option><option>Medium</option><option>Low</option></select>
        </div>
        <div>
          <label for="edit-status">Status</label>
          <select id="edit-status"><option>Pending</option><option>In Progress</option><option>Completed</option></select>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="edit-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-heading">
    <form method="dialog">
      <h2 id="delete-heading">Delete this task?</h2>
      <p id="delete-text"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="delete-cancel">Keep task</button>
        <button type="submit" class="btn danger" id="delete-confirm">Delete task</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="/script.js"></script>
</body>
</html>
